project:
  type: website
  output-dir: _site

website:
  title: "Course Lectures"
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Home
      - href: Week01_Lecture.md
        text: "Lecture 1"

# Declaring three formats at the project level means every page is rendered
# to HTML (the website), PDF, and Word. Quarto adds "Other Formats" download
# links to each HTML page automatically.
format:
  html:
    theme: cosmo
    toc: true
  pdf:
    toc: true
    number-sections: true
  docx:
    toc: true
    number-sections: true

# Only needed if a lecture runs embedded R/Python code and you want CI to
# reuse locally-cached results instead of re-executing. Leave commented for
# plain-markdown lectures.
# execute:
#   freeze: auto
